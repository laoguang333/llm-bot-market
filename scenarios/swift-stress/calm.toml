# Generated by tools/swift_stress.py; the original v5 is unchanged.
ticks = 3000
seed = 7

[market]
tick_size = 1
opening_spread = 0.15
book_depth = 10
trade_tape_limit = 200

[fees]
trade_fee_bps = 5
idle_period = 50
idle_rate = 0.002
credit_ratio = 0.01
credit_side = "both"

[margin]
max_leverage = 4.0
maintenance_leverage = 5.0
loan_rate = 0.003
interest_period = 50
mark_window = 20

[rules]
max_actions_per_tick = 20
max_open_orders = 40

[schedule]
threads = 4
max_tick_skew = 16
skip_decision_lag = 2
decision_budget_us = 2000
check_interval = 500

[world]
dividend_period = 50
min_dividend = 0
sectors = ["tech", "consumer", "energy"]

[world.seasons]
calm_to_turbulent = 0.0
turbulent_to_calm = 0.01
turbulent_rate_mult = 3.0
turbulent_size_mult = 2.0

[world.news]

[world.news.market]
events_per_1000_ticks = 0.75
change_sd = 0.027999999999999997

[world.news.sector]
