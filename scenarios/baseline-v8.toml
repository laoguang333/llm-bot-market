# v8: 10000 ticks, roughly 100 ticks per affected-stock news event.
# Same reviewed v7 bots; 10x Titan has ordinary information and normal fees.
# Historical v7/v6 remain unchanged; no challenger pass requirement.
ticks = 10000
seed = 7

[market]
tick_size = 1
# Each stock opens at its expected hold value times a random factor in [0.85, 1.15];
# the initial_price values below are then unused.
opening_spread = 0.15
book_depth = 10
trade_tape_limit = 200

[fees]
trade_fee_bps = 5
idle_period = 50
idle_rate = 0.006
credit_ratio = 0.01
credit_side = "both"

[margin]
max_leverage = 4.0
maintenance_leverage = 5.0
loan_rate = 0.003
interest_period = 50
mark_window = 20

[rules]
max_actions_per_tick = 20
max_open_orders = 40

[schedule]
threads = 4
max_tick_skew = 16
skip_decision_lag = 2
# Normal strategies keep every decision. Only sustained calls over 2 ms can be skipped.
decision_budget_us = 2000
check_interval = 500

[world]
dividend_period = 1
# Rate/news units: 50 units = 1 cent per share per tick (100 = 2 cents/tick).
dividend_scale = 50
# Combo rates: 50 units = 1 cent per complete set per tick.
# Round the account/rule total; negative bonuses round symmetrically.
combo_period = 1
combo_scale = 50
min_dividend = 0
sectors = ["tech", "consumer", "energy"]

[world.dragon]
model = "trend"
enabled = true
probability = 0.5
candidates = 3
# All stocks have irregular business updates; candidates share early growth bias.
[world.dragon.trend]
# This is the opportunity rate; total effective news also includes ordinary events.
events_per_1000_ticks = 5.0
growth_log_bias = [1.0, 1.5]
step_sd = 0.018
max_step = 0.04

[world.seasons]
calm_to_turbulent = 0.002
turbulent_to_calm = 0.01
turbulent_rate_mult = 3.0
turbulent_size_mult = 2.0

[world.news.market]
events_per_1000_ticks = 1.5
change_sd = 0.08

[world.news.sector]
events_per_1000_ticks = 2.0
change_sd = 0.10

[world.news.stock]
events_per_1000_ticks = 2.0
change_sd = 0.12

[world.news.disclosure]
lead_ticks = 120
stages = [[0, 0.05], [30, 0.25], [60, 1.0]]
# Private stages give each informed account its own range around the true change, this
# many standard deviations of the change wide; the public stage is exact.
range_widths = [3.0, 1.5]

[scoring]
# Hidden terminal units remain 50 ticks long, preserving the terminal scale.
terminal_payment_ticks = 50
terminal_ratio = 0.5
# Terminal units (each 50 ticks) are drawn from this range and not announced. Each account
# privately gets its own range of the given width containing the truth at these ticks.
terminal_payments = [10, 50]
# Preserve information timing at the start, one third and two thirds of the game.
terminal_hints = [[0, 30], [3333, 16], [6666, 6]]
objective = "rank_percentile"
series_seeds = 20

