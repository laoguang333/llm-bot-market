# Tournament: reference bots as the crowd plus strategic bots.
# Money in integer cents. Dividends are paid every 50 ticks; at 1% of price per period.
ticks = 3000
seed = 7

[market]
tick_size = 1
book_depth = 10
trade_tape_limit = 200

[fees]
trade_fee_bps = 5
idle_period = 50
idle_rate = 0.002
credit_ratio = 0.01
credit_side = "both"

[margin]
max_leverage = 4.0
maintenance_leverage = 5.0
loan_rate = 0.003
interest_period = 50
mark_window = 20

[rules]
max_actions_per_tick = 20
max_open_orders = 40

[schedule]
threads = 0
max_tick_skew = 16
skip_decision_lag = 2
check_interval = 500

[world]
dividend_period = 50
min_dividend = 0
sectors = ["tech", "consumer", "energy"]

[world.seasons]
calm_to_turbulent = 0.002
turbulent_to_calm = 0.01
turbulent_rate_mult = 3.0
turbulent_size_mult = 2.0

[world.news.market]
events_per_1000_ticks = 1.5
change_sd = 0.08

[world.news.sector]
events_per_1000_ticks = 2.0
change_sd = 0.10

[world.news.stock]
events_per_1000_ticks = 2.0
change_sd = 0.12

[world.news.disclosure]
lead_ticks = 120
stages = [[0, 0.05], [30, 0.25], [60, 1.0]]
# Private stages give each informed account its own range around the true change, this
# many standard deviations of the change wide; the public stage is exact.
range_widths = [3.0, 1.5]

[scoring]
terminal_ratio = 0.5
# The number of terminal payments is drawn from this range and not announced. Each account
# privately gets its own range of the given width containing the truth at these ticks.
terminal_payments = [20, 40]
terminal_hints = [[0, 12], [1000, 8], [2000, 4]]
objective = "rank_percentile"
series_seeds = 20

