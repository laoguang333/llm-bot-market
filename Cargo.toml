[workspace]
resolver = "2"
members = ["crates/bot-api", "crates/market", "crates/bots", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
parking_lot = "0.12"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

[profile.release]
overflow-checks = false
debug = 1
lto = "thin"
codegen-units = 1

[profile.release-checked]
inherits = "release"
overflow-checks = true

[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
unusual_byte_groupings = "allow"
